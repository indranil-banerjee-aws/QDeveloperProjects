            exit 1
          fi
          
          log_message "MSK Cluster ARN: $MSK_CLUSTER_ARN"
          
          # Get bootstrap servers for the MSK cluster
          log_message "Getting bootstrap servers for the MSK cluster..."
          BOOTSTRAP_SERVERS=$(aws kafka get-bootstrap-brokers --cluster-arn "$MSK_CLUSTER_ARN" --region $AWS_REGION --query "BootstrapBrokerStringSaslIam" --output text)
          
          if [ -z "$BOOTSTRAP_SERVERS" ]; then
            log_message "ERROR: Failed to get bootstrap servers for the MSK cluster"
            exit 1
          fi
          
          log_message "Bootstrap Servers: $BOOTSTRAP_SERVERS"
          
          # Install Kafka client tools
          log_message "Installing Kafka client tools..."
          cd /home/ec2-user
          KAFKA_VERSION=2.8.1
          SCALA_VERSION=2.13
          KAFKA_DIR=kafka_${SCALA_VERSION}-${KAFKA_VERSION}
          KAFKA_TAR=${KAFKA_DIR}.tgz
          
          if [ ! -d $KAFKA_DIR ]; then
            log_message "Downloading Kafka client tools..."
            wget -q https://archive.apache.org/dist/kafka/${KAFKA_VERSION}/${KAFKA_TAR}
