              sed -i "s|bootstrap.servers=.*|bootstrap.servers=$BOOTSTRAP_SERVERS|g" kafka-producer/kafka-client.properties
            fi
          fi
          
          # Set file ownership
          log_message "Setting file ownership..."
          chown -R ec2-user:ec2-user /home/ec2-user/project
          chown -R ec2-user:ec2-user /home/ec2-user/$KAFKA_DIR
          chown -R ec2-user:ec2-user /home/ec2-user/msk-iam-auth
          
          log_message "Setup completed successfully!"
          log_message "Summary:"
          log_message "- MSK Cluster ARN: $MSK_CLUSTER_ARN"
          log_message "- Kafka Topic: $KAFKA_TOPIC_NAME"
          log_message "- Bootstrap Servers: $BOOTSTRAP_SERVERS"
          log_message "- DynamoDB Table: PersonData"
          log_message "- Kafka Client Tools: /home/ec2-user/$KAFKA_DIR"
          log_message "- Project Path: /home/ec2-user/project/$GITHUB_PROJECT_PATH"
          log_message ""
          log_message "To run the Kafka producer:"
          log_message "  cd ~/project/$GITHUB_PROJECT_PATH/kafka-producer"
          log_message "  ./run.sh $KAFKA_TOPIC_NAME 100 batch-001"
          log_message ""
          log_message "To deploy the Lambda function:"
          log_message "  cd ~/project/$GITHUB_PROJECT_PATH/msk-dynamodb-processor"
          log_message "  sam deploy --guided"
          
          SETUP_SCRIPT_EOF
          
          chmod +x /home/ec2-user/setup-msk-environment.sh
          chown ec2-user:ec2-user /home/ec2-user/setup-msk-environment.sh
          
          # Run the setup script
          sudo -u ec2-user /home/ec2-user/setup-msk-environment.sh
          
          # Signal completion
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource EC2InstanceServerless --region ${AWS::Region}
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-DevInstance
        - Key: OS
          Value: "Amazon Linux 2023"
        - Key: InstanceClass
          Value: "C-class 8XL (c6a.8xlarge)"

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    
  MSKClusterArn:
    Description: ARN of the MSK Cluster
    Value: !If [IsProvisionedMSK, !Ref MSKClusterProvisioned, !Ref MSKClusterServerless]
    
  EC2InstanceId:
    Description: EC2 Instance ID
    Value: !If [IsProvisionedMSK, !Ref EC2InstanceProvisioned, !Ref EC2InstanceServerless]
    
  EC2PublicIP:
    Description: Public IP of the EC2 Instance
    Value: !If [IsProvisionedMSK, !GetAtt EC2InstanceProvisioned.PublicIp, !GetAtt EC2InstanceServerless.PublicIp]
    
  KeyPairName:
    Description: Name of the Key Pair for SSH access
    Value: !Ref KeyPair
    
  OperatingSystem:
    Description: Operating System of the EC2 Instance
    Value: "Amazon Linux 2023"
    
  InstanceType:
    Description: EC2 Instance Type
    Value: "c6a.8xlarge (C-class 8XL)"
