          echo "  ./build-and-run.sh person-data 100 batch-001"
          echo ""
          echo "To deploy the Lambda function:"
          echo "  cd ~/project/msk-dynamodb-processor"
          echo "  sam deploy --guided"
          EOL
          
          chmod +x /home/ec2-user/setup-project.sh
          chown ec2-user:ec2-user /home/ec2-user/setup-project.sh
          
          # Signal completion
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource EC2InstanceServerless --region ${AWS::Region}
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-DevInstance

  # Key Pair for EC2 Instance
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub ${EnvironmentName}-KeyPair

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    
  MSKClusterArn:
    Description: ARN of the MSK Cluster
    Value: !If [IsProvisionedMSK, !Ref MSKClusterProvisioned, !Ref MSKClusterServerless]
    
  EC2InstanceId:
    Description: EC2 Instance ID
    Value: !If [IsProvisionedMSK, !Ref EC2InstanceProvisioned, !Ref EC2InstanceServerless]
    
  EC2PublicIP:
    Description: Public IP of the EC2 Instance
    Value: !If [IsProvisionedMSK, !GetAtt EC2InstanceProvisioned.PublicIp, !GetAtt EC2InstanceServerless.PublicIp]
    
  KeyPairName:
    Description: Name of the Key Pair for SSH access
    Value: !Ref KeyPair
    
  KeyPairSecret:
    Description: Secret material of the Key Pair (save this securely)
    Value: !GetAtt KeyPair.PrivateKey
