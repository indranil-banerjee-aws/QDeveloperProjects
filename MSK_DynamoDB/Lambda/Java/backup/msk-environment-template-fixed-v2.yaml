AWSTemplateFormatVersion: '2010-09-09'
Description: 'MSK to DynamoDB Environment - Creates VPC, MSK Cluster, and EC2 Development Instance'

Parameters:
  EnvironmentName:
    Description: Environment name - used for resource naming
    Type: String
    Default: MSKEnvironment
    
  KafkaTopicName:
    Description: Name of the Kafka topic to create
    Type: String
    Default: person-data
    
  MSKClusterType:
    Description: Type of MSK cluster to deploy (Provisioned or Serverless)
    Type: String
    Default: Provisioned
    AllowedValues:
      - Provisioned
      - Serverless
      
  GitHubRepoURL:
    Description: URL of the GitHub repository to clone
    Type: String
    Default: https://github.com/yourusername/msk-dynamodb-project.git

Mappings:
  RegionMap:
    us-east-1:
      AMI: ami-0c7217cdde317cfec # Amazon Linux 2023
    us-east-2:
      AMI: ami-05fb0b8c1424f266b # Amazon Linux 2023
    us-west-1:
      AMI: ami-0ce2cb35386fc22e9 # Amazon Linux 2023
    us-west-2:
      AMI: ami-008fe2fc65df48dac # Amazon Linux 2023
    eu-west-1:
      AMI: ami-0694d931cee176e7d # Amazon Linux 2023

Conditions:
  IsProvisionedMSK: !Equals [!Ref MSKClusterType, 'Provisioned']
  IsServerlessMSK: !Equals [!Ref MSKClusterType, 'Serverless']

Resources:
  # VPC and Networking Resources
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-IGW

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-PublicSubnet1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-PublicSubnet2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.3.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-PrivateSubnet1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.4.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-PrivateSubnet2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-PublicRouteTable

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-PrivateRouteTable

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2

  # MSK Security Group
  MSKSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for MSK cluster
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9098
          SourceSecurityGroupId: !Ref EC2SecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-MSKSecurityGroup

  # EC2 Security Group
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EC2 development instance
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-EC2SecurityGroup

  # MSK Cluster - Provisioned or Serverless
  MSKClusterProvisioned:
    Type: AWS::MSK::Cluster
    Condition: IsProvisionedMSK
    Properties:
      ClusterName: !Sub ${EnvironmentName}-MSKCluster
      KafkaVersion: 3.4.0
      NumberOfBrokerNodes: 2
      EnhancedMonitoring: PER_BROKER
      EncryptionInfo:
        EncryptionInTransit:
          ClientBroker: TLS
          InCluster: true
      ClientAuthentication:
        Sasl:
          Iam:
            Enabled: true
      BrokerNodeGroupInfo:
        InstanceType: kafka.t3.small
        ClientSubnets:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        SecurityGroups:
          - !Ref MSKSecurityGroup
        StorageInfo:
          EBSStorageInfo:
            VolumeSize: 10
      Tags:
        Name: !Sub ${EnvironmentName}-MSKCluster

  MSKClusterServerless:
    Type: AWS::MSK::ServerlessCluster
    Condition: IsServerlessMSK
    Properties:
      ClusterName: !Sub ${EnvironmentName}-MSKServerlessCluster
      ClientAuthentication:
        Sasl:
          Iam:
            Enabled: true
      VpcConfigs:
        - SubnetIds:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref MSKSecurityGroup
      Tags:
        Name: !Sub ${EnvironmentName}-MSKServerlessCluster

  # EC2 Instance Role
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonMSKFullAccess
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/IAMFullAccess
      Path: /

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref EC2InstanceRole

  # EC2 Development Instance for Provisioned MSK
  EC2InstanceProvisioned:
    Type: AWS::EC2::Instance
    Condition: IsProvisionedMSK
    DependsOn: MSKClusterProvisioned
    Properties:
      InstanceType: t3.medium
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', AMI]
      KeyName: !Ref KeyPair
      IamInstanceProfile: !Ref EC2InstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet:
            - !Ref EC2SecurityGroup
          SubnetId: !Ref PublicSubnet1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          
          # Update system
          dnf update -y
          
          # Install development tools
          dnf install -y git maven java-17-amazon-corretto-devel jq
          
          # Install AWS CLI v2
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          ./aws/install
          
          # Install AWS SAM CLI
          curl -L "https://github.com/aws/aws-sam-cli/releases/latest/download/aws-sam-cli-linux-x86_64.zip" -o "aws-sam-cli.zip"
          unzip aws-sam-cli.zip -d sam-installation
          ./sam-installation/install
          
          # Create project directory
          mkdir -p /home/ec2-user/project
          cd /home/ec2-user/project
          
          # Clone repository
          git clone ${GitHubRepoURL} .
          
          # Set environment variables
          MSK_CLUSTER_ARN=$(aws cloudformation describe-stacks --stack-name ${AWS::StackName} --query "Stacks[0].Outputs[?OutputKey=='MSKClusterArn'].OutputValue" --output text)
          KAFKA_TOPIC_NAME=${KafkaTopicName}
          
          # Get bootstrap servers
          BOOTSTRAP_SERVERS=$(aws kafka get-bootstrap-brokers --cluster-arn $MSK_CLUSTER_ARN --query 'BootstrapBrokerStringSaslIam' --output text)
          
          # Create Kafka topic
          aws kafka create-topic --cluster-arn $MSK_CLUSTER_ARN --topic-name $KAFKA_TOPIC_NAME --number-of-partitions 3 --replication-factor 2
          
          # Create DynamoDB table
          aws dynamodb create-table \
            --table-name PersonData \
            --attribute-definitions AttributeName=id,AttributeType=S \
            --key-schema AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST
          
          # Create build and run script for Kafka producer
          cat > /home/ec2-user/project/kafka-producer/build-and-run.sh << 'EOL'
          #!/bin/bash
          
          TOPIC=${1:-person-data}
          COUNT=${2:-10}
          BATCH_ID=${3:-batch-$(date +%s)}
          
          mvn clean package
          
          java -jar target/kafka-producer-1.0-SNAPSHOT-jar-with-dependencies.jar \
            --properties kafka-client.properties \
            --topic $TOPIC \
            --count $COUNT \
            --batch-id $BATCH_ID
          EOL
          
          chmod +x /home/ec2-user/project/kafka-producer/build-and-run.sh
          
          # Create SAM config file
          mkdir -p /home/ec2-user/project/msk-dynamodb-processor
          cat > /home/ec2-user/project/msk-dynamodb-processor/samconfig.toml << 'EOL'
          version = 0.1
          [default]
          [default.deploy]
          [default.deploy.parameters]
          stack_name = "msk-dynamodb-processor"
          s3_bucket = "aws-sam-cli-managed-default-samclisourcebucket-EXAMPLE"
          s3_prefix = "msk-dynamodb-processor"
          region = "${AWS::Region}"
          confirm_changeset = true
          capabilities = "CAPABILITY_IAM"
          parameter_overrides = "MSKClusterArn=\"${MSK_CLUSTER_ARN}\" KafkaTopicName=\"${KAFKA_TOPIC_NAME}\" Environment=\"dev\" DynamoDBTableName=\"PersonData\""
          image_repositories = []
          EOL
          
          chown ec2-user:ec2-user /home/ec2-user/project/msk-dynamodb-processor/samconfig.toml
          
          # Update Kafka producer properties file
          cat > /home/ec2-user/project/kafka-producer/kafka-client.properties << 'EOL'
          # Kafka Producer Configuration
          
          # Bootstrap servers
          bootstrap.servers=$BOOTSTRAP_SERVERS
          
          # MSK IAM Authentication
          security.protocol=SASL_SSL
          sasl.mechanism=AWS_MSK_IAM
          sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
          sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
          
          # Producer specific settings
          key.serializer=org.apache.kafka.common.serialization.StringSerializer
          value.serializer=org.apache.kafka.common.serialization.StringSerializer
          EOL
          
          # Fix bootstrap servers in properties file
          sed -i "s|\$BOOTSTRAP_SERVERS|$BOOTSTRAP_SERVERS|g" /home/ec2-user/project/kafka-producer/kafka-client.properties
          
          # Set ownership
          chown -R ec2-user:ec2-user /home/ec2-user/project
          
          # Create setup script
          cat > /home/ec2-user/setup-project.sh << 'EOL'
          #!/bin/bash
          
          cd ~/project/kafka-producer
          mvn clean package
          
          echo "Project setup complete!"
          echo "To run the Kafka producer:"
          echo "  cd ~/project/kafka-producer"
          echo "  ./build-and-run.sh person-data 100 batch-001"
          echo ""
          echo "To deploy the Lambda function:"
          echo "  cd ~/project/msk-dynamodb-processor"
          echo "  sam deploy --guided"
          EOL
          
          chmod +x /home/ec2-user/setup-project.sh
          chown ec2-user:ec2-user /home/ec2-user/setup-project.sh
          
          # Signal completion
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource EC2InstanceProvisioned --region ${AWS::Region}
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-DevInstance

  # EC2 Development Instance for Serverless MSK
  EC2InstanceServerless:
    Type: AWS::EC2::Instance
    Condition: IsServerlessMSK
    DependsOn: MSKClusterServerless
    Properties:
      InstanceType: t3.medium
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', AMI]
      KeyName: !Ref KeyPair
      IamInstanceProfile: !Ref EC2InstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet:
            - !Ref EC2SecurityGroup
          SubnetId: !Ref PublicSubnet1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
